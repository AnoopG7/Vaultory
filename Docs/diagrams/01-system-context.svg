<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#37679e"/></marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker>
  </defs>

  <!-- USERS -->
  <rect x="170" y="24" width="420" height="78" rx="8" fill="#f2f6fb" stroke="#9db8d4" stroke-width="1.2"/>
  <text x="186" y="46" font-size="13" font-weight="700" fill="#1e4e79">USERS (WEB BROWSER)</text>
  <text x="186" y="68" font-size="11" fill="#334155">Admin · Store Staff · Sales Personnel · Senior Stakeholder</text>
  <text x="186" y="86" font-size="11" fill="#334155">Evergreen browsers · HTTPS · responsive (desktop / tablet / mobile)</text>

  <line x1="380" y1="102" x2="380" y2="150" stroke="#37679e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="296" y="128" font-size="11" fill="#4b5563" text-anchor="end">HTTPS</text>

  <!-- FRONTEND -->
  <rect x="120" y="152" width="520" height="142" rx="8" fill="#e8f1fb" stroke="#2f6fb2" stroke-width="1.2"/>
  <text x="136" y="176" font-size="13" font-weight="700" fill="#1e4e79">FRONTEND — REACT SPA · VERCEL (static host)</text>
  <rect x="136" y="190" width="236" height="90" rx="6" fill="#ffffff" stroke="#2f6fb2" stroke-width="1"/>
  <text x="148" y="210" font-size="11" fill="#1f2937">TypeScript + React 18 · Vite</text>
  <text x="148" y="226" font-size="11" fill="#1f2937">Tailwind CSS + shadcn/ui</text>
  <text x="148" y="242" font-size="11" fill="#1f2937">Recharts (charts)</text>
  <text x="148" y="258" font-size="11" fill="#1f2937">React Router · protected routes</text>
  <text x="148" y="274" font-size="11" fill="#1f2937">Role-aware menus &amp; navigation</text>
  <rect x="388" y="190" width="236" height="90" rx="6" fill="#ffffff" stroke="#2f6fb2" stroke-width="1"/>
  <text x="400" y="210" font-size="11" fill="#1f2937">Zustand auth store (JWT session)</text>
  <text x="400" y="226" font-size="11" fill="#1f2937">fetch client → VITE_API_BASE_URL</text>
  <text x="400" y="242" font-size="11" fill="#1f2937">OTP / magic-link handling</text>
  <text x="400" y="258" font-size="11" fill="#1f2937">CSV / PDF export download</text>
  <text x="400" y="274" font-size="11" fill="#1f2937">Toasts &amp; form state</text>

  <line x1="380" y1="294" x2="380" y2="340" stroke="#37679e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="396" y="320" font-size="10.5" fill="#4b5563">HTTPS JSON · /api/* · JWT Bearer</text>

  <!-- BACKEND -->
  <rect x="100" y="344" width="540" height="196" rx="8" fill="#e7f6ec" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="116" y="368" font-size="13" font-weight="700" fill="#116b3e">BACKEND — NODE.JS REST API (EXPRESS) · RENDER</text>
  <rect x="116" y="380" width="250" height="148" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="1"/>
  <text x="128" y="398" font-size="11" font-weight="700" fill="#116b3e">CROSS-CUTTING</text>
  <text x="128" y="418" font-size="11" fill="#1f2937">JWT verification + RBAC role middleware</text>
  <text x="128" y="434" font-size="11" fill="#1f2937">zod input schemas (body / query / params)</text>
  <text x="128" y="450" font-size="11" fill="#1f2937">central error handler → JSON 4xx/5xx</text>
  <text x="128" y="466" font-size="11" fill="#1f2937">data masking — maskFields()</text>
  <text x="128" y="482" font-size="11" fill="#1f2937">audit logging (append-only)</text>
  <text x="128" y="498" font-size="11" fill="#1f2937">security headers · rate limiting</text>
  <rect x="374" y="380" width="250" height="148" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="1"/>
  <text x="386" y="398" font-size="11" font-weight="700" fill="#116b3e">DOMAIN MODULES (14)</text>
  <text x="386" y="418" font-size="11" fill="#1f2937">auth · users · reference (stores/locations)</text>
  <text x="386" y="434" font-size="11" fill="#1f2937">products · categories · units · suppliers</text>
  <text x="386" y="450" font-size="11" fill="#1f2937">inventory · sales · purchase-orders</text>
  <text x="386" y="466" font-size="11" fill="#1f2937">reports · dashboard · alerts · audit · health</text>
  <text x="386" y="490" font-size="11" fill="#1f2937">AI ordering + warehouse recs</text>
  <text x="386" y="506" font-size="11" fill="#1f2937">per BRD/SRS §8 (→ Groq)</text>

  <!-- GROQ -->
  <rect x="652" y="360" width="100" height="96" rx="8" fill="#fdf1e3" stroke="#d97706" stroke-width="1.4"/>
  <text x="702" y="386" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">GROQ API</text>
  <text x="702" y="404" font-size="10.5" fill="#92400e" text-anchor="middle">LLM</text>
  <text x="702" y="420" font-size="10.5" fill="#92400e" text-anchor="middle">AI reasoning</text>
  <text x="702" y="436" font-size="10.5" fill="#92400e" text-anchor="middle">&amp; forecasting</text>
  <line x1="640" y1="430" x2="650" y2="420" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrD)"/>

  <line x1="380" y1="540" x2="380" y2="586" stroke="#37679e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="396" y="566" font-size="10.5" fill="#4b5563">service-role · SQL + RPCs (PostgREST)</text>

  <!-- SUPABASE -->
  <rect x="80" y="590" width="600" height="190" rx="8" fill="#efeaf9" stroke="#6a4fb8" stroke-width="1.2"/>
  <text x="96" y="614" font-size="13" font-weight="700" fill="#4c2f96">SUPABASE — POSTGRESQL PLATFORM</text>
  <rect x="96" y="628" width="150" height="138" rx="6" fill="#ffffff" stroke="#6a4fb8" stroke-width="1"/>
  <text x="108" y="648" font-size="11" font-weight="700" fill="#4c2f96">AUTH</text>
  <text x="108" y="666" font-size="10.5" fill="#1f2937">auth.users (hashed pw)</text>
  <text x="108" y="682" font-size="10.5" fill="#1f2937">email/password + OTP</text>
  <text x="108" y="698" font-size="10.5" fill="#1f2937">password reset</text>
  <text x="108" y="714" font-size="10.5" fill="#1f2937">JWT issue &amp; refresh</text>
  <text x="108" y="730" font-size="10.5" fill="#1f2937">rate-limit / lockout</text>
  <rect x="262" y="628" width="402" height="138" rx="6" fill="#ffffff" stroke="#6a4fb8" stroke-width="1"/>
  <text x="274" y="648" font-size="11" font-weight="700" fill="#4c2f96">POSTGRES · SCHEMA V1.5</text>
  <text x="274" y="666" font-size="10" fill="#1f2937">Core: profiles · stores · locations · products · inventory · sales</text>
  <text x="274" y="680" font-size="10" fill="#1f2937">sale_returns · purchase_orders · po_receipts · stock_movements</text>
  <text x="274" y="694" font-size="10" fill="#1f2937">alerts · audit_logs · ai_recommendations · suppliers · categories</text>
  <text x="274" y="708" font-size="10" fill="#1f2937">RPCs: fn_mutate_stock · fn_receive_po · fn_transfer_stock · generate_number</text>
  <text x="274" y="722" font-size="10" fill="#1f2937">Triggers: number-assign · recompute-totals · immutable-guard · cycle-guard</text>
  <text x="274" y="736" font-size="10" fill="#1f2937">Views: inventory_status · daily_sales_summary (UTC)</text>
  <text x="274" y="750" font-size="10" fill="#1f2937">Sequences: po_number_seq · sale_number_seq · CHECK constraints · Storage (exports)</text>
</svg>