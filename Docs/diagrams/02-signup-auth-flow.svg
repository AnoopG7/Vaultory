<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 620" width="740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#37679e"/></marker>
  </defs>

  <rect x="16" y="16" width="170" height="42" rx="6" fill="#e8f1fb" stroke="#2f6fb2"/>
  <text x="101" y="42" font-size="12" font-weight="700" fill="#1e4e79" text-anchor="middle">Login / Signup UI<br/>(Vercel)</text>
  <rect x="200" y="16" width="180" height="42" rx="6" fill="#e7f6ec" stroke="#2e8b57"/>
  <text x="290" y="42" font-size="12" font-weight="700" fill="#116b3e" text-anchor="middle">Auth API<br/>(Render)</text>
  <rect x="394" y="16" width="330" height="42" rx="6" fill="#efeaf9" stroke="#6a4fb8"/>
  <text x="559" y="42" font-size="12" font-weight="700" fill="#4c2f96" text-anchor="middle">Supabase Auth / Postgres</text>

  <!-- 1 -->
  <line x1="186" y1="100" x2="200" y2="100" stroke="#37679e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="18" y="92" font-size="10.5" fill="#374151">① signup page loads</text>
  <text x="18" y="106" font-size="10.5" fill="#374151">store dropdown</text>
  <text x="206" y="94" font-size="10.5" fill="#0f4c81" font-weight="700">GET /api/stores (PUBLIC)</text>
  <!-- 2 -->
  <line x1="200" y1="138" x2="186" y2="138" stroke="#37679e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="60" y="130" font-size="10.5" fill="#374151">② stores[] (non-sensitive ref data)</text>

  <!-- 3 -->
  <line x1="186" y1="176" x2="200" y2="176" stroke="#37679e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="18" y="168" font-size="10.5" fill="#374151">③ email · password ·</text>
  <text x="18" y="182" font-size="10.5" fill="#374151">full_name · storeId</text>
  <text x="206" y="170" font-size="10.5" fill="#0f4c81" font-weight="700">POST /api/auth/signup (PUBLIC)</text>

  <!-- 4 API box -->
  <rect x="210" y="200" width="160" height="46" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <circle cx="226" cy="215" r="8" fill="#2e8b57"/><text x="226" y="219" font-size="10" fill="#fff" text-anchor="middle">4</text>
  <text x="240" y="211" font-size="10.5" fill="#1f2937">zod validate · role CLAMP:</text>
  <text x="240" y="226" font-size="10.5" fill="#c0392b">role = store_staff (client ignored)</text>

  <!-- 5 -->
  <line x1="290" y1="280" x2="394" y2="280" stroke="#37679e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="272" font-size="10.5" fill="#374151">⑤</text>
  <text x="312" y="272" font-size="10.5" fill="#0f4c81" font-weight="700">signUp / admin.createUser</text>

  <!-- 6 PG box -->
  <rect x="404" y="288" width="310" height="42" rx="6" fill="#ffffff" stroke="#6a4fb8"/>
  <circle cx="419" cy="305" r="8" fill="#6a4fb8"/><text x="419" y="309" font-size="10" fill="#fff" text-anchor="middle">6</text>
  <text x="433" y="301" font-size="10.5" fill="#1f2937">auth.users created (hashed pw) · email confirm / OTP</text>
  <text x="433" y="317" font-size="10.5" fill="#1f2937">profile row: id = auth.uid() · role store_staff · store_id</text>

  <!-- 7 -->
  <line x1="394" y1="366" x2="290" y2="366" stroke="#37679e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="300" y="358" font-size="10.5" fill="#374151">⑦ user + profile created → <tspan fill="#c0392b">201 signup ok</tspan></text>

  <!-- 8 -->
  <line x1="186" y1="410" x2="200" y2="410" stroke="#37679e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="28" y="404" font-size="10.5" fill="#374151">⑧ sign in form</text>
  <text x="206" y="404" font-size="10.5" fill="#0f4c81" font-weight="700">POST /api/auth/signin</text>

  <!-- 9 -->
  <line x1="290" y1="448" x2="394" y2="448" stroke="#37679e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="440" font-size="10.5" fill="#374151">⑨ signInWithPassword</text>

  <!-- 10 -->
  <line x1="394" y1="486" x2="290" y2="486" stroke="#37679e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="300" y="478" font-size="10.5" fill="#374151">⑩ JWT access + refresh token</text>

  <!-- 11 -->
  <line x1="290" y1="524" x2="186" y2="524" stroke="#37679e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="60" y="516" font-size="10.5" fill="#0f4c81" font-weight="700">tokens → Zustand session</text>

  <!-- RBAC note -->
  <rect x="16" y="548" width="708" height="46" rx="6" fill="#fdf1e3" stroke="#d97706"/>
  <text x="28" y="568" font-size="10.5" fill="#92400e">Protected routes: auth middleware verifies JWT (Supabase JWKS) → loads profile role / store_id / status</text>
  <text x="28" y="584" font-size="10.5" fill="#92400e">→ requireRole() enforces BRD §12 matrix + store-scoping → 401 invalid / 403 forbidden · refresh handled by Supabase</text>
</svg>